name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer and portable executable
        run: npm run dist
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AcuCheck-Windows
          path: dist-win/*
          if-no-files-found: error
          retention-days: 30
